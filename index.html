      const fetchWithTimeout = async (url, options = {}, timeoutMs = 12000) => {
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timerId = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
        try {
          const res = await fetch(url, { ...options, signal: controller ? controller.signal : undefined });
          if (timerId) clearTimeout(timerId);
          return res;
        } catch (e) {
          if (timerId) clearTimeout(timerId);
          return null;
        }
      };

      const fetchApiWithFallback = async (apiPath, options = {}, timeoutMs = 12000) => {
        if (typeof window === 'undefined') return null;
        if (window.location.protocol === 'file:') {
          if (!preferCloudRef.current) {
            const localRes = await fetchWithTimeout(`http://127.0.0.1:8000${apiPath}`, options, 1200);
            if (localRes && localRes.ok) return localRes;
            preferCloudRef.current = true;
          }
          return await fetchWithTimeout(`${CLOUD_API_BASE}${apiPath}`, options, timeoutMs);
        }
        const primaryRes = await fetchWithTimeout(apiPath, options, timeoutMs);
        if (primaryRes && primaryRes.ok) return primaryRes;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          return await fetchWithTimeout(`${CLOUD_API_BASE}${apiPath}`, options, timeoutMs);

                        dynSignal = `平盤量縮整理 (0.00%)，籌碼沉澱蓄勢`;

                        dynSignal = `拉回測試支撐 (${curPct}%)，逢低觀察防守線`;

        <div className="min-h-screen p-3 md:p-6 max-w-7xl mx-auto space-y-5">
          
          {/* 頂部起漲導覽列 Header */}
          <header className="pro-panel p-4 md:p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 border-slate-800">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 via-red-500 to-amber-500 flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-rose-900/40">
                🔥
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-xl md:text-2xl font-black text-white tracking-wide flex items-center gap-2">
                    <span>領漲型態</span>
                  </h1>
                  {(() => {
                    const now = new Date();
                    const day = now.getDay();
                    const totalMins = now.getHours() * 60 + now.getMinutes();
                    let st = { text: '🌙 夜盤交易 (現貨鎖定真實收盤價)', isLive: true, badgeClass: 'bg-indigo-500/15 text-indigo-300 border-indigo-500/40' };
                    if (day === 0 || day === 6) {
                      st = { text: '⚪ 週末休市 (鎖定官方收盤價)', isLive: false, badgeClass: 'bg-slate-800 text-slate-400 border-slate-700' };
                    } else if (totalMins >= 540 && totalMins <= 810) {
                      st = { text: '🟢 台股開盤中 (即時撮合)', isLive: true, badgeClass: 'bg-rose-500/15 text-rose-400 border-rose-500/40' };
                    } else if (totalMins > 810 && totalMins <= 870) {
                      st = { text: '🟡 盤後交易 (鎖定收盤價)', isLive: false, badgeClass: 'bg-amber-500/15 text-amber-300 border-amber-500/40' };
                    }
                    return (
                      <span className={`px-2.5 py-0.5 text-xs font-bold border rounded-full flex items-center gap-1.5 ${st.badgeClass}`}>
                        <span className={`w-2 h-2 rounded-full ${st.isLive ? 'bg-rose-500 live-dot' : 'bg-slate-400'}`}></span>
                        {st.text}
                      </span>
                    );
                  })()}
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  專為台股領漲型態設計：均線糾結突破 × 爆量攻擊 × 主力吸籌 × 布林通道噴出
                </p>
              </div>
            </div>

            {/* 倒數計時與及時同步頻率選擇器 */}
            <div className="flex flex-wrap items-center gap-2.5">
              
              {/* 即時頻率選擇器 */}
              <div className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs">
                <span className="text-[10px] text-slate-400 px-2 font-bold flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>
                  頻率:
                </span>
                {[
                  { sec: 2, label: '⚡ 2s及時' },
                  { sec: 5, label: '5s' },
                  { sec: 15, label: '15s' }
                ].map(opt => (
                  <button
                    key={opt.sec}
                    onClick={() => { setSyncIntervalSec(opt.sec); setCountdown(opt.sec); }}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-black transition-all ${
                      syncIntervalSec === opt.sec
                        ? 'bg-rose-600 text-white shadow-xs'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>

              {/* 倒數狀態 Badge 與即時跳動反饋 */}
              <div className="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full transition-all duration-300 ${syncPulse ? 'bg-emerald-400 scale-150 shadow-md shadow-emerald-400/80 ring-2 ring-emerald-300' : 'bg-emerald-500/50'}`}></span>
                <span className="text-slate-400">已同步: <strong className="text-slate-200 font-mono">{lastUpdated}</strong></span>
                <span className={`px-2 py-0.5 rounded font-black text-[11px] border transition-all ${
                  isFetching || syncPulse 
                    ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60 shadow-sm' 
                    : 'bg-rose-950/80 text-rose-300 border-rose-800/50'
                }`}>
                  {isFetching ? '⚡ 撮合中...' : syncPulse ? '✔ 剛剛已更新' : `倒數 ${countdown}s`}
                </span>
              </div>

              <button
                onClick={() => { setCountdown(syncIntervalSec); fetchLiveData(); }}
                disabled={isFetching}
                className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-xs font-bold shadow-md shadow-rose-600/30 transition-all flex items-center gap-1.5 active:scale-95 disabled:opacity-50"
              >
                <span>🔄 立即重整</span>
              </button>

              <button
                onClick={() => setShowApiKeyModal(true)}
                className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-900/60 to-purple-900/60 hover:from-indigo-800/80 hover:to-purple-800/80 border border-indigo-700/60 text-indigo-200 hover:text-white text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm active:scale-95"
              >
                <span>🤖 Gemini AI 金鑰</span>
                {geminiApiKey && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>}
              </button>


            </div>
          </header>

          {/* 大盤起漲多空溫度計 (Market Breakout Gauge) */}
          <div className="pro-panel p-4 md:p-5 rounded-2xl space-y-3.5 border-rose-950/40 bg-gradient-to-br from-[#1e2536] via-[#21283a] to-[#24263e]">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-800/80">
              <div className="flex items-center gap-2">
                <span className="text-sm font-black text-rose-400 flex items-center gap-1.5">
                  <span>⚡ 大盤起漲多空溫度計</span>
                </span>
                <span className="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-500/10 text-amber-300 border border-amber-500/30">
                  多方起漲力道：{breakoutRatio}% (偏多震盪)
                </span>
              </div>
              <div className="text-[11px] text-slate-400 flex items-center gap-3">
                <span>🔥 觸發起漲個股: <strong className="text-rose-400 font-extrabold">{breakoutCount}</strong> 檔</span>
                <span>⚖️ 盤整打底: <strong className="text-slate-200 font-extrabold">{totalCount - breakoutCount}</strong> 檔</span>
              </div>
            </div>

            {/* 大盤、台指期夜盤、台積電ADR 行情網格 */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
              {marketIndices.map((idx, i) => (
                <div key={i} className={`p-2.5 rounded-xl border flex flex-col justify-between transition-all ${
                  idx.isUp 
                    ? 'bg-rose-950/20 border-rose-800/40 text-rose-400' 
                    : 'bg-emerald-950/20 border-emerald-800/40 text-emerald-400'
                }`}>
                  <div className="flex items-center justify-between text-[11px] font-semibold text-slate-300">
                    <span className="truncate">{idx.name}</span>
                    {idx.badge && (
                      <span className="px-1.5 py-0.2 text-[9px] bg-amber-900/60 text-amber-300 rounded font-black border border-amber-600/40">
                        {idx.badge}
                      </span>
                    )}
                  </div>
                  <div className="mt-1 flex items-baseline justify-between">
                    <span className="text-sm font-black text-white">{idx.price}</span>
                    <span className="text-[11px] font-extrabold">
                      {idx.isUp ? '▲ ' : '▼ '}{idx.pct}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* 模式切換器：🔥 核心焦點池 VS 🌐 全市場 1,800+ 檔即時掃描 */}
          <div className="p-3.5 rounded-2xl bg-gradient-to-r from-slate-800/80 via-[#202738] to-slate-800/80 border border-slate-800 shadow-xl space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex items-center gap-2 p-1 rounded-xl bg-[#181f2c] border border-slate-800/80">
                <button
                  onClick={() => setScanMode('CORE')}
                  className={`px-4 py-2 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 ${
                    scanMode === 'CORE'
                      ? 'bg-gradient-to-r from-rose-600 to-red-600 text-white shadow-md shadow-rose-900/40'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>🔥 核心焦點池</span>
                  <span className="px-1.5 py-0.2 rounded bg-black/40 text-[10px] text-white">28檔即時</span>
                </button>
                <button
                  onClick={() => {
                    setScanMode('FULL_MARKET');
                    if (fullMarketStocks.length === 0) fetchMarketScan('breakout', searchTerm);
                  }}
                  className={`px-4 py-2 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 ${
                    scanMode === 'FULL_MARKET'
                      ? 'bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-md shadow-blue-900/40'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>🌐 全市場 1,800+ 檔掃描</span>
                  <span className="px-1.5 py-0.2 rounded bg-blue-500/20 text-[10px] text-blue-300 font-bold border border-blue-500/30">
                    {fullMarketTotal}檔
                  </span>
                </button>
              </div>

              {/* 全市場高速搜尋欄 (支援 Enter 與按鈕直查) */}
              <div className="flex items-center gap-2 flex-1 max-w-md">
                <div className="relative flex-1">
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => handleSearchInputChange(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        if (searchTimerRef.current) clearTimeout(searchTimerRef.current);
                        executeSearch(searchTerm);
                      }
                    }}
                    placeholder="🔍 輸入台股代碼或名稱 (如 2603, 長榮, 3008, 高力)..."
                    className="w-full bg-[#1a2130] text-xs text-white pl-4 pr-8 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 placeholder:text-slate-500 transition-all font-mono shadow-inner"
                  />
                  {searchTerm && (
                    <button
                      onClick={() => {
                        setSearchTerm('');
                        setSearchResults([]);
                      }}
                      className="absolute right-2.5 top-2.5 text-slate-400 hover:text-white text-xs p-0.5"
                    >
                      ✕
                    </button>
                  )}
                </div>

                <button
                  onClick={() => {
                    if (searchTimerRef.current) clearTimeout(searchTimerRef.current);
                    executeSearch(searchTerm);
                  }}
                  className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-xs font-black transition-all flex items-center gap-1 shadow-md shadow-rose-900/30 shrink-0"
                >
                  {isSearching ? <span>⚡ 搜尋中</span> : <span>🔍 搜尋</span>}
                </button>
              </div>
            </div>

            {/* 若處於全市場掃描模式，顯示四大即時排行策略按鈕 */}
            {scanMode === 'FULL_MARKET' && (
              <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/80">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-[11px] font-bold text-indigo-300 flex items-center gap-1">
                    <span>⚡ 全市場掃描排行榜:</span>
                  </span>
                  {[
                    { id: 'breakout', label: '🎯 AI 起漲突破榜 (TOP 50)' },
                    { id: 'gain', label: '🚀 飆股漲停榜 (TOP 50)' },
                    { id: 'volume', label: '🌊 爆量攻擊榜 (TOP 50)' },
                    { id: 'institution', label: '🏛️ 三大法人買超榜 (TOP 50)' }
                  ].map(btn => (
                    <button
                      key={btn.id}
                      onClick={() => {
                        setMarketScanStrategy(btn.id);
                        fetchMarketScan(btn.id, searchTerm);
                      }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        marketScanStrategy === btn.id
                          ? 'bg-blue-600 text-white shadow-xs'
                          : 'bg-slate-800/80 text-slate-300 hover:text-white'
                      }`}
                    >
                      {btn.label}
                    </button>
                  ))}
                </div>

                <div className="text-[11px] text-slate-400 flex items-center gap-2">
                  {isScanning ? (
                    <span className="text-blue-400 animate-pulse font-bold">⚡ 正在高速掃描全市場 2,300+ 檔...</span>
                  ) : (
                    <span>已即時掃描 <strong className="text-indigo-300">{fullMarketTotal}</strong> 檔上市櫃股票</span>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* 起漲六大策略分頁 Tab Bar (僅於核心焦點池模式顯示) */}
          {scanMode === 'CORE' && (
          <div className="pro-panel p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 w-full lg:w-auto">
              {[
                { id: 'ALL', label: '🔥 全部起漲標的', count: stocks.length },
                { id: 'BREAKOUT', label: '🚀 即時爆發起漲', count: stocks.filter(s => s.change_pct > 0).length },
                { id: 'MA_CROSS', label: '⚡ 均線糾結突破', count: stocks.filter(s => s.criteria.ma_bull).length },
                { id: 'VOLUME', label: '💥 爆量長紅攻擊', count: stocks.filter(s => s.volume_ratio >= 1.3).length },
                { id: 'BOLLINGER', label: '💎 布林通道噴出', count: stocks.filter(s => s.criteria.bollinger_up).length },
                { id: 'INSTITUTION', label: '🏛️ 外資投信鎖碼', count: stocks.filter(s => s.criteria.inst_buy).length },
                { id: 'BOTTOM', label: '🏰 W底/築底起漲', count: stocks.filter(s => s.breakout_strategy.includes('底部打底') || s.breakout_strategy.includes('W底型態')).length },
                { id: 'ETF', label: '🏅 國民熱門 ETF', count: stocks.filter(s => (s.sector && s.sector.includes('ETF')) || s.breakout_strategy.includes('熱門ETF') || s.symbol.startsWith('00')).length },
              ].map(tab => {
                const isActive = selectedTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setSelectedTab(tab.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 shrink-0 ${
                      isActive
                        ? 'bg-gradient-to-r from-rose-600 to-red-600 text-white shadow-lg shadow-rose-900/40 border border-rose-500/50 scale-[1.02]'
                        : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800 border border-slate-800'
                    }`}
                  >
                    <span>{tab.label}</span>
                    <span className={`px-1.5 py-0.2 rounded text-[10px] ${isActive ? 'bg-black/30 text-white' : 'bg-slate-800 text-slate-400'}`}>
                      {tab.count}
                    </span>
                  </button>
                );
              })}
            </div>

            {/* 搜尋提示標籤 */}
            <div className="hidden lg:flex items-center text-xs text-slate-400 gap-1.5">
              <span>💡</span>
              <span>可於上方搜尋列查詢全台股 2,300+ 檔標的</span>
            </div>
          </div>
          )}

          {/* 搜尋狀態提示橫幅 */}
          {searchTerm.trim() && (
            <div className="p-3.5 rounded-2xl bg-gradient-to-r from-rose-950/30 via-slate-900 to-rose-950/30 border border-rose-800/40 flex items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                <span className="text-slate-300">
                  全市場搜尋關鍵字: <strong className="text-white font-mono text-sm bg-slate-800 px-2 py-0.5 rounded">"{searchTerm}"</strong>
                </span>
                {isSearching ? (
                  <span className="text-rose-400 animate-pulse font-bold">⚡ 正在全市場 2,329 檔深度比對中...</span>
                ) : (
                  <span className="text-emerald-400 font-bold">共找到 {filteredStocks.length} 檔符合股票</span>
                )}
              </div>

              <button
                onClick={() => {
                  setSearchTerm('');
                  setSearchResults([]);
                }}
                className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-xs font-bold"
              >
                ✕ 清除搜尋
              </button>
            </div>
          )}

          {/* 若搜尋無結果提示 */}
          {searchTerm.trim() && !isSearching && filteredStocks.length === 0 && (
            <div className="p-10 rounded-3xl bg-slate-900/50 border border-slate-800 text-center space-y-3">
              <div className="text-4xl">🔍</div>
              <div className="text-base font-bold text-white">未找到符合 "{searchTerm}" 的股票</div>
              <p className="text-xs text-slate-400 max-w-md mx-auto">
                請確認您輸入的是正確的台股股票代號 (如 2603, 3008, 2330) 或股票名稱 (如 長榮, 大立光, 台積電)。
              </p>
              <button
                onClick={() => {
                  setSearchTerm('');
                  setSearchResults([]);
                }}
                className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition-all"
              >
                返回全部股票清單
              </button>
            </div>
          )}

          {/* 個股起漲卡片網格 (Stock Cards Grid) */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredStocks.map(stock => {
              const isUp = stock.change_pct >= 0;
              const isLimitUp = stock.change_pct >= 9.5;

              return (
                <div
                  key={stock.symbol}
                  className={`pro-card p-4 md:p-5 rounded-2xl flex flex-col justify-between space-y-4 ${
                    isUp ? 'border-rose-950/60' : 'border-slate-800'
                  }`}
                >
                  <div>
                    {/* 卡片頂部：代號名稱、起漲星級與產業 */}
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                            {stock.sector}
                          </span>
                          <span className="text-xs font-semibold text-slate-400 font-mono">
                            {stock.symbol}
                          </span>
                        </div>
                        <h3 className="text-xl font-black text-white mt-1 flex items-center gap-1.5">
                          {stock.name}
                          <span className="text-xs font-bold text-slate-400">({stock.subname})</span>
                        </h3>
                      </div>

                      {/* 起漲星級與 AI 分數 (含 Gemini 消息面加權) */}
                      <div className="flex flex-col items-end">
                        <div className="text-amber-400 text-xs font-black tracking-widest">
                          {'★'.repeat(stock.breakout_stars)}{'☆'.repeat(5 - stock.breakout_stars)}
                        </div>
                        <span className="text-[10px] font-black text-rose-400 mt-0.5 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-800/40 shadow-xs">
                          AI 起漲力 {stock.ai_score} 分
                        </span>
                        <span className={`text-[9px] font-bold mt-1 px-1.5 py-0.2 rounded border ${
                          (stock.gemini_sentiment_score || 0) >= 4
                            ? 'bg-rose-950/50 text-rose-300 border-rose-800/50'
                            : (stock.gemini_sentiment_score || 0) >= 0
                              ? 'bg-emerald-950/50 text-emerald-300 border-emerald-800/50'
                              : 'bg-amber-950/50 text-amber-300 border-amber-800/50'
                        }`}>
                          📰 Gemini: {(stock.gemini_sentiment_score || 0) >= 0 ? '+' : ''}{stock.gemini_sentiment_score || 0}分
                        </span>
                      </div>
                    </div>

                    {/* 即時價格與漲跌幅 Banner */}
                    <div className="mt-3.5 p-3 rounded-xl bg-[#1c2333] border border-slate-800/80 flex items-center justify-between">
                      <div>
                        <div className="text-[10px] text-slate-400">最新即時現價</div>
                        <div className="text-2xl font-black text-white tracking-tight font-mono">
                          NT$ {stock.close.toLocaleString()}
                        </div>
                      </div>

                      <div className={`px-3 py-1.5 rounded-xl border text-sm font-black flex items-center gap-1 ${
                        isUp 
                          ? 'bg-rose-950/60 text-rose-400 border-rose-700/60 breakout-glow' 
                          : 'bg-emerald-950/60 text-emerald-400 border-emerald-700/60'
                      }`}>
                        <span>{isUp ? '▲ +' : '▼ '}{stock.change_pct}%</span>
                        {isLimitUp && <span className="text-[10px] bg-red-600 text-white px-1 rounded ml-1">漲停</span>}
                      </div>
                    </div>

                    {/* 起漲策略標籤 Badges */}
                    <div className="mt-3 flex flex-wrap gap-1.5">
                      {stock.breakout_strategy.map((tag, idx) => (
                        <span key={idx} className="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-950/40 text-rose-300 border border-rose-800/50 flex items-center gap-1">
                          <span>⚡</span> {tag}
                        </span>
                      ))}
                      <span className="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-950/40 text-amber-300 border border-amber-800/50">
                        量比 {stock.volume_ratio}x
                      </span>
                    </div>

                    {/* 起漲四項關鍵檢核表 (Checklist) */}
                    <div className="mt-3.5 p-3 rounded-xl bg-slate-900/60 border border-slate-800/80 space-y-1.5 text-xs">
                      <div className="text-[11px] font-bold text-slate-400 mb-1 flex items-center justify-between">
                        <span>🔍 起漲訊號四重檢驗:</span>

                  <button
                    onClick={() => setShowApiKeyModal(false)}
                    className="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">
                  系統預設已內建 <strong>Gemini 智慧金融語意引擎</strong>，無需金鑰即可正常使用！<br/>
                  若您有自己的 Google AI Studio 金鑰（免費申請），可在此填入以解鎖 <strong>Gemini 1.5 Flash 深度即時推論</strong>。
                </p>

                <div className="space-y-1.5">
                  <label className="text-xs text-slate-400 font-bold">Gemini API Key:</label>
                  <input
                    type="password"
                    defaultValue={geminiApiKey}
                    id="geminiKeyInput"
                    placeholder="AIzaSy..."
                    className="w-full bg-[#1a2130] text-xs text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 font-mono"
                  />
                  <div className="text-[10px] text-slate-500">
                    金鑰僅保存在您的個人瀏覽器中 (localStorage)，不會洩漏至任何外部伺服器。
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <a
                    href="https://aistudio.google.com/app/apikey"
                    target="_blank"
                    className="text-xs text-indigo-400 hover:underline flex items-center gap-1"
                  >
                    <span>👉 免費申請 Gemini Key</span>
                  </a>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleSaveGeminiKey('')}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
                    >
                      清除金鑰
                    </button>
                    <button
                      onClick={() => {
                        const val = document.getElementById('geminiKeyInput').value.trim();
                        handleSaveGeminiKey(val);
                      }}
                      className="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30"
                    >
                      儲存設定
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 券商分點籌碼進出 Modal 彈窗 (Broker Branch Chip Modal) */}
          {chipModalData && (
            <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-3 md:p-6 z-50 animate-fadeIn">
              <div className="pro-panel p-5 md:p-6 rounded-3xl max-w-4xl w-full max-h-[92vh] overflow-y-auto space-y-4 border-indigo-900/60 shadow-2xl bg-[#1e2536]">
                
                {/* 彈窗頂部：個股資訊與關閉按鈕 */}
                <div className="flex items-start justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/50 flex items-center justify-center text-2xl">
                      🏛️
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-xl md:text-2xl font-black text-white">{chipModalData.name}</h2>
                        <span className="text-xs font-mono font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded">
                          {chipModalData.symbol}
                        </span>
                        <span className="px-2.5 py-0.5 rounded-full text-xs font-black bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">
                          券商分點籌碼分析
                        </span>
                      </div>
                      <div className="flex items-center gap-3 text-xs text-slate-400 mt-1">
                        <span>成交價: <strong className="text-white font-mono text-sm">NT$ {chipModalData.close}</strong></span>
                        <span>成交量: <strong className="text-slate-200 font-mono">{(chipModalData.volume || 0).toLocaleString()} 張</strong></span>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => setChipModalData(null)}
                    className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* 籌碼集中度與型態信號 */}
                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div className="text-[11px] text-slate-400">主力籌碼多空診斷</div>
                    <div className="text-sm font-black text-white mt-0.5">
                      {chipModalData.chip_signal || "🟢 主力鎖碼 (多方籌碼優勢)"}
                    </div>
                  </div>

                  <div className="flex items-center gap-4 text-xs">
                    <div className="text-right">
                      <div className="text-[10px] text-slate-400">5日籌碼集中度</div>
                      <div className={`text-base font-black font-mono ${(chipModalData.concentration_5d || 0) >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {(chipModalData.concentration_5d || 0) >= 0 ? '+' : ''}{chipModalData.concentration_5d || 14.8}%
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-[10px] text-slate-400">主力買賣超差額</div>
                      <div className={`text-base font-black font-mono ${(chipModalData.net_diff || 0) >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {(chipModalData.net_diff || 0) >= 0 ? '+' : ''}{(chipModalData.net_diff || 0).toLocaleString()} 張
                      </div>
                    </div>
                  </div>
                </div>

                {/* 三大法人今日買賣超儀表 */}
                {chipModalData.institution && (
                  <div className="p-3.5 rounded-2xl bg-[#1c2333] border border-slate-800 space-y-2">
                    <div className="text-xs font-bold text-slate-400 flex items-center justify-between">
                      <span>三大法人今日進出 (單位: 張)</span>
                      <span className="text-[11px]">合計: <strong className={`${chipModalData.institution.total >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>{(chipModalData.institution.total || 0).toLocaleString()} 張</strong></span>
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="p-2 rounded-xl bg-slate-900/70 border border-slate-800">
                        <div className="text-[10px] text-slate-400">🌐 外資買賣超</div>
                        <div className={`font-black font-mono mt-0.5 ${chipModalData.institution.foreign >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                          {chipModalData.institution.foreign >= 0 ? '+' : ''}{(chipModalData.institution.foreign || 0).toLocaleString()}
                        </div>
                      </div>
                      <div className="p-2 rounded-xl bg-slate-900/70 border border-slate-800">
                        <div className="text-[10px] text-slate-400">🏢 投信買賣超</div>
                        <div className={`font-black font-mono mt-0.5 ${chipModalData.institution.trust >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                          {chipModalData.institution.trust >= 0 ? '+' : ''}{(chipModalData.institution.trust || 0).toLocaleString()}
                        </div>
                      </div>
                      <div className="p-2 rounded-xl bg-slate-900/70 border border-slate-800">
                        <div className="text-[10px] text-slate-400">💼 自營商買賣超</div>
                        <div className={`font-black font-mono mt-0.5 ${chipModalData.institution.dealer >= 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                          {chipModalData.institution.dealer >= 0 ? '+' : ''}{(chipModalData.institution.dealer || 0).toLocaleString()}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 券商分點進出明細左右對照表 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  
                  {/* 左欄：買超前五大分點 */}
                  <div className="p-3.5 rounded-2xl bg-rose-950/10 border border-rose-900/30 space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold text-rose-400 pb-1.5 border-b border-rose-900/30">
                      <span>🟢 買超前五大主力分點</span>
                      <span className="text-[10px] text-slate-400">淨買超 · 佔比 · 均價</span>
                    </div>

                    <div className="space-y-1.5">
                      {(chipModalData.major_buyers || []).map((b, idx) => (
                        <div key={idx} className="flex items-center justify-between p-2 rounded-xl bg-slate-900/60 border border-slate-800/80 text-xs">
                          <div className="flex items-center gap-2">
                            <span className="w-5 h-5 rounded-full bg-rose-500/20 text-rose-400 text-[10px] font-black flex items-center justify-center">
                              {b.rank}
                            </span>
                            <span className="font-bold text-white">{b.branch}</span>
                          </div>
                          <div className="text-right font-mono">
                            <div className="text-rose-400 font-bold">+{b.net_shares.toLocaleString()} 張 ({b.pct}%)</div>
                            <div className="text-[10px] text-slate-400">均價 ${b.avg_price}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 右欄：賣超前五大分點 */}
                  <div className="p-3.5 rounded-2xl bg-emerald-950/10 border border-emerald-900/30 space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold text-emerald-400 pb-1.5 border-b border-emerald-900/30">
                      <span>🔴 賣超前五大分點</span>
                      <span className="text-[10px] text-slate-400">淨賣超 · 佔比 · 均價</span>
                    </div>

                    <div className="space-y-1.5">
                      {(chipModalData.major_sellers || []).map((s, idx) => (
                        <div key={idx} className="flex items-center justify-between p-2 rounded-xl bg-slate-900/60 border border-slate-800/80 text-xs">
                          <div className="flex items-center gap-2">
                            <span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-black flex items-center justify-center">
                              {s.rank}
                            </span>
                            <span className="font-bold text-white">{s.branch}</span>
                          </div>
                          <div className="text-right font-mono">
                            <div className="text-emerald-400 font-bold">{s.net_shares.toLocaleString()} 張 ({s.pct}%)</div>
                            <div className="text-[10px] text-slate-400">均價 ${s.avg_price}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* 底部關閉按鈕 */}
                <div className="pt-2 text-center">
                  <button
                    onClick={() => setChipModalData(null)}
                    className="px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition-all shadow-md"
                  >
                    關閉分點籌碼視窗
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
